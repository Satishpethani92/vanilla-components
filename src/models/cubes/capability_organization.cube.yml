cubes:
  - name: capability_organization
    title: Capabilities Organization
    sql_alias: cap_org
    data_source: my-db
    sql: >
      WITH CapabilitiesCTE AS (
      SELECT *
      FROM csdb.capabilities
      WHERE (
          org_id = { COMPILE_CONTEXT.securityContext.org_id }
          AND create_user_id = { COMPILE_CONTEXT.securityContext.usr_id }
        ) OR cap_id IN (
          SELECT ro.obj_id
          FROM csdb.user_role_access ura
          JOIN csdb.role_object ro ON ura.rbj_id = ro.rbj_id
          WHERE ura.usr_id = { COMPILE_CONTEXT.securityContext.usr_id }
          AND ro.obj_type = 'CAPABILITIES'
        )
      )
      select og.*, max(case when co.cap_id is null then "False" else "True" end) as cap_assigned, max(case when co.cap_id is null then 0 else 1 end) as count_cap_assigned from
      (select parent_org_id,concat(parent_org_id,"-",cap_id) as parent_org_cap_id,cap_id,cap_code, osa.org_id, ogs_name, osa.ogs_id,concat(osa.ogs_id,"-",cap_id) as ogs_cap_id,cap.name,case when char_length(ogs_name)>6 then ogs_code else ogs_name end as name_id
      from 
      org_structure osa inner join CapabilitiesCTE cap on osa.org_id = cap.org_id) og left join capability_organization co 
      on og.ogs_id = co.ogs_id and og.cap_id = co.cap_id 
      group by 1,2,3,4,5,6
            
    dimensions:
      - name: Parent_org_id
        sql: Parent_org_id
        type: number
        title: 'Parent Organization ID'

      - name: cap_id
        sql: cap_id
        type: number
        primary_key: true
        title: 'Capability ID'

      - name: cap_id_disp
        sql: cap_id
        type: number
        title: 'Capability ID Display'

      - name: org_id
        sql: ogs_id
        type: number
        title: 'Organization Id'

      - name: ogs_name
        sql: ogs_name
        type: string
        title: 'Organization Structure Name'

      - name: ogs_id
        sql: ogs_id
        type: number
        title: 'Organization Structure ID'

      - name: name
        sql: name
        type: string
        title: 'Capability Name'

      - name: cap_assigned
        sql: cap_assigned
        type: boolean
        title: 'Capability assigned'

      - name: cap_code
        sql: cap_code
        type: string
        title: 'Capability code'

      - name: name_id
        sql: name_id
        type: string
        title: 'Organization Name Id'
      
      - name: parent_org_cap_id
        sql: parent_org_cap_id
        type: number
        title: 'Parent organization Capability Id'

      - name: ogs_cap_id
        sql: ogs_cap_id
        type: number
        title: 'Organization Capability Id'

    measures:
      - name: count
        type: count
        title: '# of Capabilities'
      
      - name: sum
        type: sum
        sql: count_cap_assigned
        title: '# of Assigned Capabilities'